name: Mobile CI + APK Release

on:
  push:
    branches: ["main"]
    paths:
      - "staff-mobile/**"
      - "mobile-consumer/**"
      - "shared/**"
      - ".github/workflows/mobile-apk.yml"
  pull_request:
    paths:
      - "staff-mobile/**"
      - "mobile-consumer/**"
      - "shared/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Typecheck and lint gate. Runs on pull requests too, where building a signed
  # APK is pointless — catching a broken `shared/` change here is the whole
  # reason the workflow watches that path.
  check:
    name: Check ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: staff-mobile
            app_dir: staff-mobile
          - app_name: consumer
            app_dir: mobile-consumer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "${{ matrix.app_dir }}/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app_dir }}

      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.app_dir }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.app_dir }}

  build-apk:
    name: Build ${{ matrix.app_name }} APK
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: staff-mobile
            app_dir: staff-mobile
            apk_name: Kaarobar-staff.apk
          - app_name: consumer
            app_dir: mobile-consumer
            apk_name: Kaarobar-customer.apk

    steps:
      # Full checkout: the apps import `shared/` via @shared / @core aliases, so
      # Metro needs that folder present at bundle time.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "${{ matrix.app_dir }}/package-lock.json"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app_dir }}

      # android/ is not committed — Expo generates it from app.json (CNG).
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: ${{ matrix.app_dir }}

      # Keep the historical signing identity so released APKs stay
      # upgrade-compatible with previously installed builds.
      - name: Restore debug signing keystore
        run: |
          set -euo pipefail
          test -f credentials/debug.keystore
          cp credentials/debug.keystore android/app/debug.keystore
        working-directory: ${{ matrix.app_dir }}

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
        working-directory: ${{ matrix.app_dir }}/android

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p staged
          src="${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            src="${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          cp "$src" "staged/${{ matrix.apk_name }}"
          ls -la staged

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.app_name }}-apk"
          path: "staged/${{ matrix.apk_name }}"
          if-no-files-found: error

  release:
    name: Publish APKs to GitHub Release
    needs: build-apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: "*-apk"
          merge-multiple: true

      - name: List release files
        run: ls -la apks

      - name: Create GitHub release (APKs only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-${{ github.sha }}"
          name: "Android ${{ github.sha }}"
          body: |
            Kaarobar Android APKs for commit `${{ github.sha }}`.

            - **Kaarobar-staff.apk** — staff app (`staff-mobile`)
            - **Kaarobar-customer.apk** — customer app (`mobile-consumer`)

            Source is not packaged in this release. APKs are built with
            `expo prebuild` and signed with the project debug keystore until a
            release keystore is configured.
          files: apks/*.apk
          fail_on_unmatched_files: true
