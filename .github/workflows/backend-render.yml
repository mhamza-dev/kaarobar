name: Backend CI + Render Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "kaarobar-BE/**"
      - ".github/workflows/backend-render.yml"
  pull_request:
    paths:
      - "kaarobar-BE/**"
      - ".github/workflows/backend-render.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaarobar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: kaarobar-BE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir + OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            kaarobar-BE/deps
            kaarobar-BE/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('kaarobar-BE/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install deps + compile
        run: |
          mix deps.get
          mix compile
        env:
          MIX_ENV: test

      - name: Run tests
        run: mix test
        env:
          MIX_ENV: test
          DATABASE_URL: ecto://postgres:postgres@localhost/kaarobar_test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set."
            echo "Either add the Deploy Hook from Render → Settings → Deploy Hook,"
            echo "or enable Auto-Deploy from GitHub on the Render service and ignore this job."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."
