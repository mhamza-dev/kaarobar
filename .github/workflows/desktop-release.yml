name: Desktop Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS DMG
            builder_args: --mac dmg
            artifact_glob: "kaarobar-desktop/release/*.dmg"
          - os: windows-latest
            label: Windows EXE
            builder_args: --win nsis
            artifact_glob: "kaarobar-desktop/release/*.exe"
          - os: ubuntu-latest
            label: Linux DEB
            builder_args: --linux deb
            artifact_glob: "kaarobar-desktop/release/*.deb"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "kaarobar-desktop/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: kaarobar-desktop

      - name: Build renderer (Vite)
        run: npm run build
        working-directory: kaarobar-desktop

      - name: Package installer
        env:
          # Unsigned CI builds (no Apple/Windows code-signing certs yet)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
        working-directory: kaarobar-desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish installers to GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: desktop-*
          merge-multiple: true

      - name: List release files
        run: ls -la installers

      - name: Create GitHub release (binaries only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "desktop-${{ github.sha }}"
          name: "Desktop ${{ github.sha }}"
          body: |
            Kaarobar desktop installers for commit `${{ github.sha }}`.

            - **macOS:** `.dmg`
            - **Windows:** `.exe` (NSIS installer)
            - **Linux:** `.deb`

            Source is not packaged in this release. Installers are unsigned CI builds.
          files: |
            installers/*.dmg
            installers/*.exe
            installers/*.deb
          fail_on_unmatched_files: true
